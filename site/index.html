    <!--

      所以在这里按当前路径注入唯一的一条；站内跳转时由导航（Nav.tsx）跟着改 href。
    -->

      (function () {
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = 'https://celadon.maxsong.me' + (location.pathname.replace(/\/+$/, '') || '/');
        document.head.appendChild(link);
      })();
    </script>
